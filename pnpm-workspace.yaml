packages:
  - "client"
  # - "torii"

# Which dependencies may run install scripts. pnpm 11 replaced the `onlyBuiltDependencies` list
# with this map, and an unlisted package that *has* a script is "unreviewed" — it fails the install
# with ERR_PNPM_IGNORED_BUILDS rather than being skipped quietly. So every one of them is answered
# here, and a new one has to be answered rather than ignored.
#
# Everything set to false already ships the binary it would build, as a platform package pnpm has
# installed and the library resolves at require time — so the script is either a no-op or not ours.
allowBuilds:
  # next.js image optimization: `install/check.js` finds the prebuilt @img/sharp-* and only compiles
  # from source if none matches. Kept true so image optimization can be switched back on without a
  # reinstall (client/next.config.ts).
  sharp: true
  # `install.js` only rewrites its own CLI shim over the @esbuild/* platform binary, and the shim
  # runs that binary regardless — so vite and storybook (which use the Node API) are unaffected, and
  # so is bundling a scratch entry by hand (`specs/ENGINE.md` §7): esbuild is nobody's direct
  # dependency here, so there is no `.bin/esbuild` to link either way — reach for `pnpm dlx esbuild`.
  esbuild: false
  # An optional native accelerator for cbor-x (via the Dojo/Torii client), which falls back to JS.
  cbor-extract: false
  # `postinstall` prints a donation banner.
  es5-ext: false
  # `postinstall` phones home for a version check.
  "@reown/appkit": false

catalog:
  #--------------------------------
  # next.js client
  #
  next: ^16.2.12
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3

  #--------------------------------
  # styling — tailwind v4 (see specs/CODING_STYLE.md)
  #
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  postcss: ^8.5.23
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  lucide-react: ^1.27.0

  #--------------------------------
  # data flow (see specs/NEXTJS_DATA_FLOW.md)
  #
  "@tanstack/react-query": ^5.101.4
  sonner: ^2.0.7

  #--------------------------------
  # client state — zustand stores (client/src/stores/), same version as ec-dapp
  #
  zustand: ^5.0.14

  #--------------------------------
  # starknet / cartridge controller
  #
  # Major versions match /Users/roger/Dev/Dojo/controller/examples/minimal
  # (starknet 8, starknet-react 5); the Controller tracks the latest 0.13.x.
  #
  starknet: ^8.9.2
  "@starknet-react/core": ^5.0.3
  "@starknet-react/chains": ^5.0.3
  "@cartridge/controller": ^0.13.16
  "@cartridge/connector": ^0.13.16

  #--------------------------------
  # dojo.js
  #
  # Same versions as /Users/roger/Dev/Realms/LORE/packages/client-sn, the
  # reference for our profile/Torii setup. `torii-client` is a thin re-export of
  # `@dojoengine/torii-wasm` — see next.config.ts for the Turbopack wiring.
  #
  "@dojoengine/core": ^1.8.8
  "@dojoengine/torii-client": ^1.8.2

  #--------------------------------
  # pistols
  #
  # Manifests, chain config, tokens and starknet utils for every Pistols game.
  # Source: /Users/roger/Dev/Realms/pistols/sdk
  #
  "@underware/pistols-sdk": ^1.3.2

  #--------------------------------
  # three.js — the 3D card table (client/src/components/pages/collection/)
  #
  # Driven through react-three-fiber, so the scene is React components and the cards are
  # ordinary props/state — no imperative scene graph of our own. `drei` is only used for
  # `<Html>`, the DOM-anchored-to-a-3D-point overlay. R3F 9 requires React 19.
  #
  three: ^0.185.1
  "@types/three": ^0.185.1
  "@react-three/fiber": ^9.6.1
  "@react-three/drei": ^10.7.7

  #--------------------------------
  # storybook — the wallet-free preview surface for `components/ui/`
  #
  # `@storybook/nextjs-vite` reuses the client's tsconfig aliases and PostCSS/Tailwind
  # pipeline; `vite` is its peer, declared so pnpm's strict linker can resolve it.
  #
  storybook: ^10.5.4
  "@storybook/react": ^10.5.4
  "@storybook/nextjs-vite": ^10.5.4
  vite: ^8.1.5

  #--------------------------------
  # misc
  #
  "@types/node": ^26.1.1
  typescript: ^5.9.3
